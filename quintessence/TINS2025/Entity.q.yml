properties:


  - name: sprite
    type: ALLEGRO_BITMAP*
    init_with: nullptr
    exposed: true

  - name: model
    type: AllegroFlare::Model3D*
    init_with: nullptr
    exposed: true

  - name: name
    type: std::string
    init_with: '"[unset-name]"'
    exposed: true

  - name: tmj_id
    type: uint32_t
    init_with: 0
    exposed: true

  - name: type
    type: TINS2025::Entity::Type
    init_with: TINS2025::Entity::ENTITY_TYPE_UNDEF
    exposed: true

  - name: animation_mode
    type: uint32_t
    init_with: TINS2025::Entity::ANIMATION_MODE_STANDING
    exposed: true

  - name: distance_to_player
    type: float
    init_with: 9999.0f
    exposed: true

  - name: aabb2d
    type: AllegroFlare::Physics::AABB2D
    init_with: '{}'
    exposed: true

  - name: flags
    type: uint32_t
    init_with: 0
    exposed: true


enums:


  - name: Flags
    bitwise: true
    scope: public
    enumerators:
      - FLAG_NONE
      - FLAG_INACTIVE
      - FLAG_HIDDEN
      - FLAG_COLLIDES_WITH_PLAYER
      - FLAG_COLLIDES_WITH_TILEMAP
      - FLAG_TRACKS_DISTANCE_TO_PLAYER
      - FLAG_EMITS_HYPE_AURA
      - FLAG_DIALOG_TRIGGERS_ONLY_ONCE
      - FLAG_COLLECTED


  - name: Type
    to_string: true
    from_string: true
    scope: public
    enumerators:
       - ENTITY_TYPE_UNDEF
       - ENTITY_TYPE_PLAYER
       - ENTITY_TYPE_FRIEND_1
       - ENTITY_TYPE_FRIEND_2
       - ENTITY_TYPE_FRIEND_3
       - ENTITY_TYPE_APPLE
       - ENTITY_TYPE_CARROT
       - ENTITY_TYPE_INFO_SIGN
       - ENTITY_TYPE_RED_CARROT
       - ENTITY_TYPE_DIALOG_TRIGGER
       - ENTITY_TYPE_DIALOG_TRIGGER_1
       - ENTITY_TYPE_DIALOG_TRIGGER_2
       - ENTITY_TYPE_DIALOG_TRIGGER_3
       - ENTITY_TYPE_DIALOG_TRIGGER_4
       - ENTITY_TYPE_DIALOG_TRIGGER_5
       - ENTITY_TYPE_BUNBUCKS_CAKE
       - ENTITY_TYPE_CAKE_1
       - ENTITY_TYPE_CAKE_2
       - ENTITY_TYPE_CAKE_3
       - ENTITY_TYPE_COMPOSITE_CAKE
       - ENTITY_TYPE_THE_PLANT
       - ENTITY_TYPE_CAMERA_0
       - ENTITY_TYPE_CAMERA_1
       - ENTITY_TYPE_CAMERA_2
       - ENTITY_TYPE_CAMERA_3
       - ENTITY_TYPE_CAMERA_4
       - ENTITY_TYPE_CAMERA_5
       - ENTITY_TYPE_CAMERA_6
       - ENTITY_TYPE_CAMERA_7
       - ENTITY_TYPE_CAMERA_8
       - ENTITY_TYPE_CAMERA_9
       - ENTITY_TYPE_LOCATION_POINT
       - ENTITY_TYPE_NOTEBOOK_PAGE
       - ENTITY_TYPE_GIRAFFE
       - ENTITY_TYPE_GOAT
       - ENTITY_TYPE_LEOPARD
       - ENTITY_TYPE_TIGER
       - ENTITY_TYPE_ZEBRA


  - name: AnimationMode
    scope: public
    enumerators:
       - ANIMATION_MODE_UNDEF
       - ANIMATION_MODE_STANDING
       - ANIMATION_MODE_WALKING_WOBBLY
       - ANIMATION_MODE_JUMPING_IN_EXCITEMENT


methods:


  - name: type_to_string
    type: std::string
    body: |
      static std::map<uint32_t, std::string> names = {
         { ENTITY_TYPE_GIRAFFE, "Giraffe" },
         { ENTITY_TYPE_GOAT, "Goat" },
         { ENTITY_TYPE_LEOPARD, "Leopard", },
         { ENTITY_TYPE_TIGER, "Tiger", },
         { ENTITY_TYPE_ZEBRA, "Zebra", },
      };
      if (names.count(type) == 0)
      {
         throw std::runtime_error("AAAAAAAAAAAAA! Entity: No name found for this entity type.");
      }
      return names[type];
    body_dependency_symbols:
      - std::map


  - name: has_flag
    type: bool
    parameters:
      - name: flag
        type: uint32_t
        default_argument: 0
    guards: [ (flag != 0) ]
    body: |
      return (flags & flag) != 0;


  - name: draw
    body: |
      // Draw the box
      al_draw_rectangle(
         aabb2d.get_x(),
         aabb2d.get_y(),
         aabb2d.get_x()+aabb2d.get_w(),
         aabb2d.get_y()+aabb2d.get_h(),
         ALLEGRO_COLOR{1, 1, 1, 1},
         1.0
      );

      // Draw the sprite (bottom centered)
      if (sprite)
      {
         ALLEGRO_BITMAP *bitmap = sprite;

         float center_x = aabb2d.get_x() + aabb2d.get_w() / 2.0f;
         float center_y = aabb2d.get_y() + aabb2d.get_h() / 2.0f;

         float bitmap_w = al_get_bitmap_width(bitmap);
         float bitmap_h = al_get_bitmap_height(bitmap);

         float draw_x = center_x - bitmap_w / 2.0f;
         float draw_y = center_y - bitmap_h;

         al_draw_bitmap(bitmap, draw_x, draw_y, 0);
      }
    body_dependency_symbols:
      - al_draw_rectangle


dependencies:


  - symbol: ALLEGRO_BITMAP
    headers: [ allegro5/allegro.h ]
  - symbol: AllegroFlare::Physics::AABB2D
    headers: [ AllegroFlare/Physics/AABB2D.hpp ]
  - symbol: al_draw_rectangle
    headers: [ allegro5/allegro_primitives.h ]
  - symbol: AllegroFlare::Model3D
    headers: [ AllegroFlare/Model3D.hpp ]
  - symbol: TINS2025::Entity::Type
    headers: [ TINS2025/Entity.hpp ]


